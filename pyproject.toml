[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilacl"
version = "0.1.0"
description = "Research prototype: bilateral knee MRI ACL anatomy estimation and investigational scaffold hypothesis generation. Not a medical device."
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "nibabel>=5", "pydicom>=2.4", "SimpleITK>=2.3",
  "scikit-image>=0.22", "scikit-learn>=1.3", "trimesh>=4", "manifold3d>=2.3", "rtree>=1",
  "pyyaml>=6", "pillow>=10", "httpx>=0.25", "fastapi>=0.110", "uvicorn>=0.27",
  "torch>=2.2", "monai>=1.3", "matplotlib>=3.8", "h5py>=3.9", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bilacl = "bilacl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bilacl = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
