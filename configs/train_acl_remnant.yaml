# Task C (torn-ACL remnants). BLOCKED until expert-annotated rupture cases exist.
# A task-B (intact ACL) checkpoint may initialise this model, but it must be evaluated on
# remnant data before use: intact and torn ACLs are different distributions.
task: C_acl_remnant
out_dir: runs/train/acl_remnant_unet
seed: 0
spacing_mm: [0.5, 0.5, 0.5]
patch: [96, 96, 96]
batch_size: 2
epochs: 300
iters_per_epoch: 250
lr: 0.0002
fg_prob: 0.8
channels: [32, 64, 128, 256]
strides: [2, 2, 2]
init_checkpoint: null
init_note: "set to a task-B checkpoint for transfer learning; record which data it was trained on"
allow_synthetic: false
