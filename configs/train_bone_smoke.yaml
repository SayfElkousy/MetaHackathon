# SMOKE TEST: exercises the training code on synthetic phantoms. The resulting
# checkpoint is labelled smoke_test and is NOT an anatomical segmentation model.
task: A_bone
out_dir: workspace/train/smoke_bone
seed: 0
spacing_mm: [1.0, 1.0, 1.0]
patch: [48, 48, 48]
batch_size: 2
epochs: 2
iters_per_epoch: 6
lr: 0.0003
channels: [8, 16, 32, 64]
strides: [2, 2, 2]
num_res_units: 1
allow_synthetic: true
smoke_test: true
device: cpu
