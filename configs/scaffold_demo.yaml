# Scaffold candidate parameters for the SYNTHETIC demonstration.
#
# Every dimension below is an illustrative geometric input chosen so the code paths
# can be exercised. None is a recommended, optimal, or literature-validated value
# for a ligament scaffold. Replace with values from your own fabrication process
# and cited studies, and record the source in assumption_sources.
estimate: remnant_reconciled        # which anatomy estimate to build from (review may override)
mode: bridge_gap                    # bridge_gap | full_envelope
envelope_scale: 1.0
overlap_mm: 3.0                     # design choice: extension onto each remnant
remnant_clearance_mm: 0.3
bone_clearance_mm: 0.5
preserve_attachments: true          # intact attachment regions are not replaced
attachment_margin_mm: 2.0
enthesis_transition: false
alignment_pattern: twisted          # none | parallel | twisted  (hypothesized guidance architecture)
twist_deg: 30.0                     # hypothesis parameter, not a measured fibre twist
channel_diameter_mm: 0.6            # ILLUSTRATIVE ONLY
min_wall_mm: 0.4                    # ILLUSTRATIVE fabrication constraint
min_feature_mm: 0.3                 # ILLUSTRATIVE fabrication resolution
n_channels_max: 19
grid_res_mm: 0.15
assumption_sources:
  channel_diameter_mm: "user assumption for software demonstration; not a recommended pore/channel size"
  min_wall_mm: "user assumption: placeholder for a fabrication-process minimum wall"
  twist_deg: "user hypothesis; ACL fibre twist is not measurable on routine MRI"
